# Append this to your DSH profile's cordis.patch.yml
# (~/.dsh/profiles/<profile>/cordis.patch.yml) with this folder at
# ~/.dsh/profiles/<profile>/plugins/discord-autoreply.
#
# Discord auto-reply: a tool-less chat preset plus the bridge plugin
# (plugins/discord-autoreply). Friends' messages can never run tools here.
- insert:
    - id: preset-discord
      name: '@deepseek-ai/dsh-agent-preset'
      inject:
        - biliBasicCompactionPolicy
      config:
        id: discord
        name: Discord
        description: Chat-only replies for Discord friends; no tools.
        order: 9
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are replying on Discord on behalf of the user, chatting with
                their close friends. Each user message is one Discord message written
                as "Name: text", sometimes with images. Answer the question or react
                naturally, short and casual (usually one to three sentences), in the
                same tone as the message. Language: these are Hong Kong friends who
                text in colloquial written Cantonese mixed with English (e.g. "咁都唔識?
                you serious?", "佢真係好on9", "lol 你搞咩"). Reply the same way: spoken
                Cantonese characters (係、唔、咩、佢、嘅、咗、啲、嘢、冇) with English words
                mixed in naturally, never formal written Chinese or Mandarin (no 的、
                是、什麼、他、沒有、了). Mirror their mix: mostly English if they wrote
                English, mostly Cantonese if they wrote Cantonese; for an image with no
                text, use Cantonese with some English. This friend group runs on
                banter: when a friend is being dumb, cocky, provoking, trolling or
                insulting (a middle finger, a stupid question, trash talk), roast them
                hard - savage, witty, profanity is fine, aim at what they said or
                sent. Otherwise just be a funny, helpful friend. Never break character
                or mention being an AI. Output only the reply text: no name prefix, no
                quotes, no headings.
              complete: true
              includeRuntimeContext: false
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
    - id: discord-autoreply
      name: ./plugins/discord-autoreply/index.js
      config:
        enabled: true
        # Empty list = answer in whichever channel is open in Discord.
        # Or list channel IDs (right-click a channel > Copy Channel ID).
        channels: []
        provider: deepseek-account
        model: deepseek-flash
        reasoningEffort: 'off'
        agentPreset: discord
        replyPrefix: ''
        # draft = answer goes into the chat's message box, you press Enter.
        # send = posted as you automatically (riskier for your account).
        delivery: draft
        # Local control API (127.0.0.1 only) for future tools; 0 = off.
        apiPort: 18790
        # Sessions you archive in DSH are deleted for good after this many hours.
        archiveRetentionHours: 24
