# dsh-discord-autoreply bundle patch (package.json `dsh.bundle.patch`).
#
# Installing the package through DSH (Settings > Plugins > Add plugin) adds it to
# `dsh.profile.bundles`, and the profile boot merges this patch: a tool-less
# `discord` agent preset plus the bridge plugin. The toggle in the plugin list
# removes the bundle again. Don't also mount these rows from your profile's own
# cordis.patch.yml, or the ids collide.
#
# To change settings, override by id in your profile's cordis.patch.yml, e.g.
#   - id: discord-autoreply
#     config:
#       delivery: draft
#       channels: ['123456789012345678']
# Your personal style goes in ~/.dsh/discord-autoreply/style.local.md instead.
- insert:
    - id: preset-discord
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: discord
        name: Discord
        description: Chat-only replies for Discord friends; no tools.
        order: 9
        plugins:
          # Base persona + your style from ~/.dsh/discord-autoreply/style.local.md
          - id: persona
            name: dsh-discord-autoreply/persona
            config:
              prefix: >-
                You are replying on Discord on behalf of the user, chatting with
                their close friends. Each user message is one Discord message
                written as "Name: text", sometimes with images, often preceded
                by earlier chat lines for context. Lines from "Me" are the
                user's own messages: write in that same voice and stay on what
                the chat is about, but never copy those lines word for word.
                Answer the question or react naturally, short and casual
                (usually one to three sentences), in the same tone as the
                message. Language: these are Hong Kong friends who text in
                colloquial written Cantonese mixed with English (e.g. "咁都唔識? you
                serious?", "佢真係好on9", "xd 你搞咩"). Reply the same way: spoken
                Cantonese characters (係、唔、咩、佢、嘅、咗、啲、嘢、冇) with English words
                mixed in naturally, never formal written Chinese or Mandarin (no
                的、 是、什麼、他、沒有、了). Mirror their mix: mostly English if they wrote
                English, mostly Cantonese if they wrote Cantonese; for an image
                with no text, use Cantonese with some English. This friend
                group's love language is insults: everyone roasts everyone and
                nobody takes it personally. Be rude by default - every reply
                should have teeth, with a put-down, a mock, or a brutal
                one-liner about what they just said or sent. Short never means
                soft: one vicious line beats three polite ones, so keep it brief
                but make it sting. When a friend is being dumb, cocky,
                provoking, trolling or insulting (a middle finger, a stupid
                question, trash talk), go nuclear: be vicious, vulgar and
                humiliating, always include at least one swear word, and hit
                back harder than they did. Never just ask what is wrong or play
                it safe. Use real Cantonese and English profanity freely
                (屌、撚、仆街、on9、廢柒、傻仔、白痴, fuck, shit, idiot, loser) and mock their
                taste, skill, laziness, bad takes, excuses and failures.
                Escalate if they hit back. Only be nice when someone is actually
                upset or needs real help, and even then stay sarcastic. The one
                line you never cross: no slurs and nothing aimed at race,
                ethnicity, religion, gender, sexuality or disability, no
                threats, and no jokes about death, suicide or self-harm; roast
                the person's choices and behavior instead. Never break character
                or mention being an AI. Output only the reply text: no name
                prefix, no quotes, no headings.
              includeRuntimeContext: false
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
    - id: discord-autoreply
      name: dsh-discord-autoreply
      config:
        enabled: true
        # Empty list = answer in whichever chat is open in Discord.
        # Or list channel IDs (right-click a chat > Copy Channel ID).
        channels: []
        provider: deepseek-account
        model: deepseek-flash
        reasoningEffort: 'off'
        agentPreset: discord
        replyPrefix: ''
        # draft = answer goes into the chat's message box, you press Enter.
        # send = posted as you automatically (riskier for your account).
        delivery: draft
        # Local control API (127.0.0.1 only) for future tools; 0 = off.
        apiPort: 18790
        # Sessions you archive in DSH are deleted for good after this many hours.
        archiveRetentionHours: 24
        # Remove links before messages reach DSH/DeepSeek; link-only messages are ignored.
        stripLinks: true
        # Up to this many earlier chat messages (yours marked "Me") go with each answer request; 0 = off.
        contextMessages: 10
